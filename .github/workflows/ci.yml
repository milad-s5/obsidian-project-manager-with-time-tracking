name: CI

# The release workflow only runs for tags, so until now nothing checked a
# change before it was tagged. This builds and tests every push and pull
# request.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc runs first inside the build, so type errors fail here too
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
